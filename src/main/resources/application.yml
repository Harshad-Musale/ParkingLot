server:
  port: 1222

# MYSQL
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/parkinglot
    username: root
    password: root

  liquibase:
    enabled: true
    changeLog: "classpath:db/changelog/db.changelog-master.yaml"
    drop-first: false

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: true

# SWAGGER
springdoc:
  api-docs:
    enabled: true
  show-actuator: true

# JWT
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expireMs: 6000000 # 1 Hour
  refrEshexpireMs: 6000000 # 1 Hour

management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
          - prometheus
  prometheus:
    metrics:
      export:
        enabled: true
